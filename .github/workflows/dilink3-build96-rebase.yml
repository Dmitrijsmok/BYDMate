name: Build96 Rebase Merge Probe

on:
  push:
    branches:
      - build96-rebase-v3152
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dilink3-build96-rebase
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: build96-rebase-v3152
          fetch-depth: 0

      - name: Generate final Build95 tree on its v3.14.3 base
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B generated95 origin/dilink3-production-v3143
          git fetch origin build95 build94
          git show origin/build95:.github/dilink3-build95-runner.py > /tmp/build95-runner.py
          python3 -m py_compile /tmp/build95-runner.py
          python3 /tmp/build95-runner.py
          git diff --check
          git config user.name "Build96 Rebase Probe"
          git config user.email "build96@invalid.local"
          git add -A
          git commit -m "probe: materialize Build95 final tree"

      - name: Merge upstream v3.15.2 and report conflicts
        id: merge
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff 194d837f701d03fd24b50a9ea0bcd17b73e7fd5a
          rc=$?
          echo "merge_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "=== STATUS ==="
          git status --short
          echo "=== CONFLICTS ==="
          git diff --name-only --diff-filter=U
          echo "=== DIFF STAT ==="
          git diff --stat || true
          exit 0

      - name: Stop if merge conflicts exist
        shell: bash
        run: |
          set -euo pipefail
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Build96 merge conflicts require explicit resolution:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile merged source
        env:
          CI: 'true'
        run: ./gradlew --no-daemon :app:compileDebugKotlin --stacktrace
