name: Build92 DiLink3 Exact Alice

on:
  push:
    branches:
      - build92
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dilink3-build92-exact-alice
  cancel-in-progress: true

jobs:
  build92:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean production source
        uses: actions/checkout@v7
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Load and apply Build70-92 patch chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin build92
          git show origin/build92:.github/dilink3-build92-runner.py > /tmp/build92-runner.py
          python3 -m py_compile /tmp/build92-runner.py
          python3 /tmp/build92-runner.py

      - name: Verify Build92 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 60042' app/build.gradle.kts
          grep -F 'BYDMate DiLink3 Build92' app/src/main/AndroidManifest.xml
          grep -F 'com.yandex.browser:id/alice_input_quarknyx' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'EXACT_ALICE_DESC = "голосовой помощник"' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'Build92DirectBootGuard' app/src/main/kotlin/com/bydmate/app/service/BootReceiver.kt
          grep -F 'BUILD70_327_CONSUMED' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -F 'private fun sherpaThreadCount(): Int = 2' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt
          if grep -F 'BUILD82_STREAM_PREBUFFER_MS' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt; then exit 1; fi
          if grep -F 'coerceIn(2, 4)' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt; then exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile and run frozen baseline regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.SherpaTtsEngineTest' \
            --tests 'com.bydmate.app.voice.GigaAmSegmenterTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.agent.AgentOrchestratorTest' \
            --tests 'com.bydmate.app.agent.LlmAgentBackendTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest' \
            --stacktrace

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity signer and upgrade path
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60042'" /tmp/badging
          grep -F "application-label:'BYDMate DiLink3 Build92'" /tmp/badging
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer
          grep -Fi 'certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' /tmp/signer
          test 60042 -gt 60041
          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build92.apk
          sha256sum verified/BYDMate-DiLink3-Build92.apk | tee verified/BYDMate-DiLink3-Build92.sha256

      - name: Build metadata
        shell: bash
        run: |
          cat > verified/BUILD92.txt <<'EOF'
          BYDMate DiLink3 Build92
          base=v3.14.3
          baseline=Build85-frozen
          package=com.bydmate.app.dilink3prodtest
          previousVersionCode=60041
          versionCode=60042
          aliceExactAccessibilityId=com.yandex.browser:id/alice_input_quarknyx
          aliceWarmPath=true
          aliceRetryWindowMs=8300
          coldBoot327BlockerStart=true
          stockAssistant327Block=retained
          normalVoiceBaseline=Build85-unchanged
          EOF

      - name: Upload Build92
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build92
          path: verified/
          retention-days: 14
