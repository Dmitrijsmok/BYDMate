name: Alice Build 4.8 Stable Duck

on:
  push:
    branches: [alice-build4-8-stable-duck-signing]
  workflow_dispatch:

concurrency:
  group: alice-build4-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Build 1
        run: python3 .github/alice-build1-patch.py
      - name: Apply side-by-side identity
        run: python3 .github/alice-sideby-identity.py
      - name: Apply helper identity
        run: python3 .github/alice-sideby-helper.py
      - name: Apply Build 2 identity
        run: python3 .github/alice-build2-identity.py
      - name: Apply Browser base
        run: python3 .github/alice-build2-browser.py
      - name: Apply Build 3 identity
        run: python3 .github/alice-build3-identity.py
      - name: Apply DiLink3 route
        run: python3 .github/alice-build3-decision.py
      - name: Apply setting bridge
        run: python3 .github/alice-build3-toggle-mirror.py
      - name: Apply Browser correction
        run: python3 .github/alice-build3-browserfix.py
      - name: Apply Build 4
        run: python3 .github/alice-build4-runner.py
      - name: Apply Build 4.8
        run: python3 .github/alice-build4-8-runner.py

      - name: Verify Build 4.8
        run: |
          grep -R 'applicationId = "com.bydmate.app.alice4"' app/build.gradle.kts
          grep -R 'versionCode = 64009' app/build.gradle.kts
          grep -R '3.15.2-alice4.8-stable-duck' app/build.gradle.kts
          grep -R 'BUILD7_BOOT_PREWARM_DISABLED source=build95_recovery' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -R 'BUILD7_STOCK_ASSISTANT_BACK' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'BUILD8_MANUAL_DUCK_ENABLED target=4' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'beginExternalAliceDuck()' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'BUILD8_LISTENING_READY desc=true' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'endExternalAliceDuck("left_yandex:' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'duckMusicForExternalAssistant' app/src/main/kotlin/com/bydmate/app/voice/AudioCapture.kt
          grep -R 'EXTERNAL_ASSISTANT_DUCK_VOLUME_INDEX = 4' app/src/main/kotlin/com/bydmate/app/voice/AudioCapture.kt
          grep -R 'ALICE_EXTERNAL_DUCK begin' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          ! grep -R 'BUILD6_MANUAL_DUCK_DISABLED reason=system_audio_focus' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BYDMate-v3.15.2-alice4.8-stable-duck-debug.apk
          sha256sum out/BYDMate-v3.15.2-alice4.8-stable-duck-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build4-8-Debug
          path: out/BYDMate-v3.15.2-alice4.8-stable-duck-debug.apk
          retention-days: 30
