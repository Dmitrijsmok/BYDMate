name: Alice Build 5.0 Command Bridge

on:
  push:
    branches: [alice-build5-0-command-bridge]
  workflow_dispatch:

concurrency:
  group: alice-build5-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Build 1
        run: python3 .github/alice-build1-patch.py
      - name: Apply side-by-side identity
        run: python3 .github/alice-sideby-identity.py
      - name: Apply helper identity
        run: python3 .github/alice-sideby-helper.py
      - name: Apply Build 2 identity
        run: python3 .github/alice-build2-identity.py
      - name: Apply Browser base
        run: python3 .github/alice-build2-browser.py
      - name: Apply Build 3 identity
        run: python3 .github/alice-build3-identity.py
      - name: Apply DiLink3 route
        run: python3 .github/alice-build3-decision.py
      - name: Apply setting bridge
        run: python3 .github/alice-build3-toggle-mirror.py
      - name: Apply Browser correction
        run: python3 .github/alice-build3-browserfix.py
      - name: Apply Build 4
        run: python3 .github/alice-build4-runner.py
      - name: Apply Build 5.0
        run: python3 .github/alice-build5-0-runner.py

      - name: Verify stable Alice baseline and 5.0 bridge
        run: |
          grep -R 'applicationId = "com.bydmate.app.alice4"' app/build.gradle.kts
          grep -R 'versionCode = 64011' app/build.gradle.kts
          grep -R '3.15.2-alice5.0-command-bridge' app/build.gradle.kts
          grep -R 'BUILD8_MANUAL_DUCK_ENABLED target=4' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'BUILD8_LISTENING_READY desc=true' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'BUILD7_STOCK_ASSISTANT_BACK' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'BUILD7_BOOT_PREWARM_DISABLED source=build95_recovery' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          ! grep -R 'maybePromptAliceAutostartOnce()' app/src/main/kotlin/com/bydmate/app/MainActivity.kt
          ! grep -R 'Для стабильной работы после перезапуска DiLink разрешите автозапуск BYDMate Alice' app/src/main/kotlin/com/bydmate/app/AliceSetupActivity.kt
          grep -R 'BRIDGE_ENABLE_CHANGED enabled=' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -R 'BRIDGE_POLL_START longPollMs=' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R '/api/poll?wait_ms=' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'BRIDGE_COMMAND_RECEIVED' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'BRIDGE_COMMAND_DISPATCH' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'BRIDGE_COMMAND_RESULT' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'speedGateBlockReason(command, latestData?.speed)' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'AliceBridgeCommandTranslator.resolve' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R '"climate.temperature"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"seat.driver.heat"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"window.driver.open"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"window.rear_right.position"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R 'WINDOW_POSITION_REGEX' app/src/main/kotlin/com/bydmate/app/data/vehicle/CommandTranslator.kt
          ! grep -R '"doors.unlock" ->' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          ! grep -R '"trunk.open" ->' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt

      - name: Unit test command bridge
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BYDMate-v3.15.2-alice5.0-command-bridge-debug.apk
          sha256sum out/BYDMate-v3.15.2-alice5.0-command-bridge-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build5-0-Command-Bridge-Debug
          path: out/BYDMate-v3.15.2-alice5.0-command-bridge-debug.apk
          retention-days: 30
