name: Verify 64045 Rebase 3.19

on:
  push:
    branches:
      - rebase/64045-author-3.19

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Full verification
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:detekt --stacktrace
