name: APK 64041

on:
  push:
    branches:
      - quick/64041-voice-startup-rollback

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify source
        run: |
          grep -q 'versionCode = 64041' app/build.gradle.kts
          ! grep -A35 'private fun startContinuousSession()' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt | grep -q 'prewarmNetwork'
          ! grep -A35 'private fun startContinuousSession()' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt | grep -q 'agentOrchestrator.prewarm'
      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Stage
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BYDMate-3.18.2-64041-VoiceStartupRollback-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.2-64041-VoiceStartupRollback-debug-fast
          path: out/BYDMate-3.18.2-64041-VoiceStartupRollback-debug.apk
          retention-days: 2
      - name: Export signing tools
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools-64041-fast
          path: signing-tools
          retention-days: 2
