name: Fast 3.19.5 navigator debug APK

on:
  push:
    branches:
      - feat/navigation-dropdown-v3.19.5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-debug-fast-3195-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore repository signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BYDMATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BYDMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BYDMATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BYDMATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/bydmate-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | \
            grep -E 'Owner:|SHA256:'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/BYDMate-3.19.5-64051-NavDropdown-DebugClone.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging out/BYDMate-3.19.5-64051-NavDropdown-DebugClone.apk | \
            grep -E "package: name='com\.bydmate\.app\.debug'|versionCode='64051'|application-label:'BYDMate Debug'"
          "$BT/apksigner" verify --verbose --print-certs \
            out/BYDMate-3.19.5-64051-NavDropdown-DebugClone.apk
          sha256sum out/BYDMate-3.19.5-64051-NavDropdown-DebugClone.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.19.5-64051-NavDropdown-GitHubSigned
          path: out/BYDMate-3.19.5-64051-NavDropdown-DebugClone.apk
          retention-days: 14
