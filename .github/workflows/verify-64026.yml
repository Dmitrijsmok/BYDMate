name: Verify 64026 local polish

on:
  push:
    branches:
      - fix/64026-local-polish-ui-nav

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check Alice worker syntax
        run: node --check reference/alice-worker/worker.mjs
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: detekt
        run: ./gradlew :app:detekt --stacktrace
      - name: Build full unoptimized APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.17.5-64026-full-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 2
