name: Alice Build 5.4 Aperture Percent

on:
  push:
    branches: [alice-build5-4-sunroof-percent]
  workflow_dispatch:

concurrency:
  group: alice-build5-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare stable Alice4 signing key
        env:
          ALICE_SIGNING_KEYSTORE_B64: ${{ secrets.ALICE_SIGNING_KEYSTORE_B64 }}
          ALICE_SIGNING_STORE_PASSWORD: ${{ secrets.ALICE_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ALICE_SIGNING_KEYSTORE_B64"
          test -n "$ALICE_SIGNING_STORE_PASSWORD"
          printf '%s' "$ALICE_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bydmate-alice-stable.jks"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/bydmate-alice-stable.jks" \
            -alias bydmate-alice \
            -storepass:env ALICE_SIGNING_STORE_PASSWORD \
            > "$RUNNER_TEMP/alice-signing-cert.txt"
          grep -F 'SHA256: B8:39:BC:11:CF:AD:61:EC:6A:89:DE:10:DC:0E:5E:B7:4C:BA:25:C5:7D:A1:16:AD:E3:0B:F4:A8:9D:70:C0:54' "$RUNNER_TEMP/alice-signing-cert.txt"

      - name: Normalize upstream v3.16.0 for historical Alice patch chain
        run: python3 .github/alice-build5-3-base-compat.py

      - name: Apply Build 1
        run: python3 .github/alice-build1-patch.py
      - name: Apply side-by-side identity
        run: python3 .github/alice-sideby-identity.py
      - name: Apply helper identity
        run: python3 .github/alice-sideby-helper.py
      - name: Apply Build 2 identity
        run: python3 .github/alice-build2-identity.py
      - name: Apply Browser base
        run: python3 .github/alice-build2-browser.py
      - name: Apply Build 3 identity
        run: python3 .github/alice-build3-identity.py
      - name: Apply DiLink3 route
        run: python3 .github/alice-build3-decision.py
      - name: Apply setting bridge
        run: python3 .github/alice-build3-toggle-mirror.py
      - name: Apply Browser correction
        run: python3 .github/alice-build3-browserfix.py
      - name: Apply Build 4
        run: python3 .github/alice-build4-runner.py
      - name: Apply Build 5.3 v3.16.0 integration
        run: python3 .github/alice-build5-3-runner.py
      - name: Apply Build 5.4 sunroof percentage positioning
        run: python3 .github/alice-build5-4-sunroof-percent.py
      - name: Apply Build 5.4 window percentage positioning
        run: python3 .github/alice-build5-4-window-percent.py
      - name: Apply Build 5.4 TikTok launcher
        run: python3 .github/alice-build5-4-tiktok.py

      - name: Verify upstream 3.16.0 + Alice 5.4 bridge
        run: |
          set -euo pipefail
          grep -R 'applicationId = "com.bydmate.app.alice4"' app/build.gradle.kts
          grep -R 'versionCode = 64015' app/build.gradle.kts
          grep -R '3.16.0-alice5.4-sunroof-percent' app/build.gradle.kts

          grep -R 'BUILD8_MANUAL_DUCK_ENABLED target=4' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'BRIDGE_ENABLE_CHANGED enabled=' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -R 'BRIDGE_POLL_START longPollMs=' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'AliceAppCommandDispatcher' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'BRIDGE_SUNROOF_POSITION' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'requested == "sunroof.position"' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'vehicleApi.dispatch("天窗停止")' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R 'BRIDGE_WINDOW_POSITION' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R '"window.driver.position"' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -R '"主驾停止".*window_driver_ctrl.*3' app/src/main/kotlin/com/bydmate/app/data/vehicle/CommandTranslator.kt
          grep -R 'ACTION_TIKTOK_OPEN = "app.tiktok.open"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceAppCommandDispatcher.kt
          grep -R '"com.zhiliaoapp.musically"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceAppCommandDispatcher.kt

          # Upstream command surface retained from v3.15.5 and expanded in v3.16.0.
          grep -R 'FAN_REGEX' app/src/main/kotlin/com/bydmate/app/data/vehicle/CommandTranslator.kt
          grep -R '"吹面".*ac_wind_mode' app/src/main/kotlin/com/bydmate/app/data/vehicle/CommandTranslator.kt
          grep -R '"前排车窗半开"' app/src/main/kotlin/com/bydmate/app/data/vehicle/CommandTranslator.kt
          grep -R '"后排车窗通风"' app/src/main/kotlin/com/bydmate/app/data/vehicle/CommandTranslator.kt
          test -f app/src/main/kotlin/com/bydmate/app/data/push/FidPushChannel.kt
          test -f app/src/main/kotlin/com/bydmate/app/helper/push/FidPushRegistry.kt

          # Alice semantic surface.
          grep -R '"climate.fan_level"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"climate.airflow_face"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"window.driver.half"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"window.front.half"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R '"window.rear.vent"' app/src/main/kotlin/com/bydmate/app/data/remote/AliceBridgeCommandTranslator.kt
          grep -R 'app.waze.open' app/src/main/kotlin/com/bydmate/app/data/remote/AliceAppCommandDispatcher.kt

          # Raw cloud writes remain impossible.
          ! grep -R 'featureId.*opt\|deviceType.*opt\|writeFid.*opt' app/src/main/kotlin/com/bydmate/app/data/remote

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Re-sign with stable Alice4 key and verify certificate
        env:
          ALICE_SIGNING_STORE_PASSWORD: ${{ secrets.ALICE_SIGNING_STORE_PASSWORD }}
          ALICE_SIGNING_KEY_PASSWORD: ${{ secrets.ALICE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ALICE_SIGNING_STORE_PASSWORD"
          test -n "$ALICE_SIGNING_KEY_PASSWORD"

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          INPUT_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          KEYSTORE="$RUNNER_TEMP/bydmate-alice-stable.jks"
          OUTPUT_APK="out/BYDMate-v3.16.0-alice5.4-sunroof-percent-stable-signed-debug.apk"

          test -f "$INPUT_APK"
          test -f "$KEYSTORE"
          mkdir -p out
          cp "$INPUT_APK" "$RUNNER_TEMP/alice5.4-unsigned.apk"

          zip -q -d "$RUNNER_TEMP/alice5.4-unsigned.apk" \
            'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true

          "$ZIPALIGN" -f -p 4 \
            "$RUNNER_TEMP/alice5.4-unsigned.apk" \
            "$RUNNER_TEMP/alice5.4-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias bydmate-alice \
            --ks-pass env:ALICE_SIGNING_STORE_PASSWORD \
            --key-pass env:ALICE_SIGNING_KEY_PASSWORD \
            --out "$OUTPUT_APK" \
            "$RUNNER_TEMP/alice5.4-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee "$RUNNER_TEMP/alice5.4-signature.txt"

          EXPECTED='B839BC11CFAD61EC6A89DE10DC0E5EB74CBA25C57DA116ADE30BF4A89D70C054'
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/{print toupper($NF); exit}' "$RUNNER_TEMP/alice5.4-signature.txt" | tr -d ':')"
          SIGNER_COUNT="$(grep -c 'certificate SHA-256 digest:' "$RUNNER_TEMP/alice5.4-signature.txt")"
          test "$ACTUAL" = "$EXPECTED"
          test "$SIGNER_COUNT" -eq 1

          sha256sum "$OUTPUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build5-4-Aperture-Percent-Stable-Signed-Debug
          path: out/BYDMate-v3.16.0-alice5.4-sunroof-percent-stable-signed-debug.apk
          retention-days: 30
