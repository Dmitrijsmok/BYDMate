name: Export Android signing tools

on:
  push:
    branches: [tool-export-apksigner]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Collect signing tools
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOLS_DIR="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p out/lib
          cp "$TOOLS_DIR/apksigner" out/apksigner
          cp "$TOOLS_DIR/zipalign" out/zipalign
          cp "$TOOLS_DIR/lib/apksigner.jar" out/lib/apksigner.jar
          cp -a "$TOOLS_DIR/lib64" out/lib64
          cp reference/alice-worker/BYDMate-Alice-worker.txt out/BYDMate-Alice-worker-5.8.txt
          chmod +x out/apksigner out/zipalign
          "$TOOLS_DIR/apksigner" version
          "$TOOLS_DIR/zipalign" -h >/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools
          path: out/
          retention-days: 1
