name: Verify 64024 Recovery

on:
  push:
    branches:
      - recovery/alice-nav-audio-proven-baseline

permissions:
  contents: read

concurrency:
  group: verify-64024-recovery
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Recovery invariants
        run: |
          set -euo pipefail
          grep -R 'versionCode = 64024' app/build.gradle.kts
          grep -R 'versionName = "3.17.5"' app/build.gradle.kts
          grep -R 'com.byd.vrassistant' app/src/main/kotlin/com/bydmate/app/helper/HelperDaemon.kt
          grep -R 'alice_native_takeover' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'EXTERNAL_ASSISTANT_DUCK_VOLUME_INDEX = 4' app/src/main/kotlin/com/bydmate/app/voice/AudioCapture.kt
          grep -R 'ttsEngine.warmUp()' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          grep -R 'ttsEngine.startQueue()' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          grep -R 'KEY_ROUTE_NAVIGATOR_PACKAGE' app/src/main/kotlin/com/bydmate/app/data/automation/RouteNavigatorUris.kt
          test -f docs/ALICE-RECOVERY-STATUS.md

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Build full unoptimized APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.17.5-64024-recovery-full-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
