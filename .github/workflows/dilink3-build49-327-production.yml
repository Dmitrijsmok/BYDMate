name: DiLink3 Build52 BYD-Compatible Key Trace

on:
  push:
    branches: [dilink3-voice-compat]
  workflow_dispatch:

concurrency:
  group: dilink3-build52-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare updateable DiLink3 diagnostic package
        run: |
          base64 -d .github/dilink3-debug.keystore.b64 > .github/dilink3-debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          signing_needle = '''    signingConfigs {\n        if (keystorePropsFile.exists()) {'''
          signing_replacement = '''    signingConfigs {\n        create("dilink3Diag") {\n            storeFile = rootProject.file(".github/dilink3-debug.keystore")\n            storePassword = "dilink3debug"\n            keyAlias = "dilink3debug"\n            keyPassword = "dilink3debug"\n        }\n        if (keystorePropsFile.exists()) {'''
          if signing_needle not in text:
              raise SystemExit('signingConfigs insertion point not found')
          text = text.replace(signing_needle, signing_replacement, 1)
          needle = '''    buildTypes {\n        release {'''
          replacement = '''    buildTypes {\n        debug {\n            applicationIdSuffix = ".dilink3diag"\n            versionNameSuffix = "-dilink3diag"\n            signingConfig = signingConfigs.getByName("dilink3Diag")\n        }\n        release {'''
          if needle not in text:
              raise SystemExit('buildTypes insertion point not found')
          text = text.replace(needle, replacement, 1)

          # Build49 (49002) is the last confirmed installable build on this DiLink 3 unit.
          # The 500005/510001 experiments pass normal Android APK verification but the BYD
          # package UI reports that it cannot process them. Keep the usable sequence strictly
          # increasing while staying below 65536 to avoid a suspected OEM parser limitation.
          diag_version_code = 60001
          assert 49002 < diag_version_code < 65536
          old_version = '        versionCode = 433'
          if old_version not in text:
              raise SystemExit('versionCode insertion point not found')
          text = text.replace(old_version, f'        versionCode = {diag_version_code}', 1)
          gradle.write_text(text)
          print(f'Build52 versionCode={diag_version_code}')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          old = 'android:label="BYDMate"'
          if old not in m:
              raise SystemExit('application label not found')
          manifest.write_text(m.replace(old, 'android:label="BYDMate DiLink3 Build52"', 1))
          PY

      - name: Apply DiLink3 E2E bridge
        run: python3 .github/patch-dilink3-e2e.py
      - name: Apply AIHubMix quick setup
        run: python3 .github/patch-dilink3-aihubmix.py
      - name: Apply timing logs and Telegram export
        run: python3 .github/patch-dilink3-logging.py
      - name: Apply mic button diagnostics
        run: python3 .github/patch-dilink3-mic-button.py
      - name: Fix diagnostic Activity focus invocation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/bydmate/app/MainActivity.kt')
          p.write_text(p.read_text().replace('"hasFocus=$hasWindowFocus"', '"hasFocus=${hasWindowFocus()}"'))
          PY
      - name: Apply guided diagnostic wizard baseline
        run: python3 .github/patch-dilink3-wizard.py
      - name: Fix wizard primitive input-device collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/bydmate/app/ui/diagnostics/DiLink3VoiceDebugPanel.kt')
          p.write_text(p.read_text().replace('InputDevice.getDeviceIds().mapNotNull', 'InputDevice.getDeviceIds().toList().mapNotNull'))
          PY
      - name: Apply keyCode 304 and latency tracing
        run: python3 .github/patch-dilink3-304-latency.py
      - name: Reapply known-good build40 vehicle fixes
        run: python3 .github/patch-dilink3-build40-compat.py
      - name: Apply build41 system assistant and deep TTS diagnostics
        run: python3 .github/patch-dilink3-build41-system-tts.py
      - name: Apply build42 AccessibilityService interception test
        run: python3 .github/patch-dilink3-build42-a11y.py
      - name: Replace old wizard with build43 multi-test lab
        run: python3 .github/patch-dilink3-build43-testlab.py
      - name: Add build44 rootless ADB alternatives
        run: python3 .github/patch-dilink3-build44-adb-lab.py
      - name: Add build45 safe ADB transactions and restore
        run: python3 .github/patch-dilink3-build45-safe-adb-tx.py
      - name: Restore build46 log-share button
        run: python3 .github/patch-dilink3-build46-log-share.py
      - name: Apply build47 minimal 304 block lab
        run: python3 .github/patch-dilink3-build47-304-block-lab.py
      - name: Apply build48 focused 327 block lab
        run: python3 .github/patch-dilink3-build48-327-block-lab.py
      - name: Apply build49 production 327 blocker
        run: python3 .github/patch-dilink3-build49-327-production.py
      - name: Apply build50 clean all-key trace
        run: python3 .github/patch-dilink3-build50-clean-keytrace.py

      - name: Build Build52 APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK package, manifest, alignment and signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/build52-badging.txt
          grep -F "package: name='com.bydmate.app.dilink3diag' versionCode='60001'" /tmp/build52-badging.txt
          grep -F "sdkVersion:'29'" /tmp/build52-badging.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/build52-signature.txt
          grep -F "certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb" /tmp/build52-signature.txt
          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-build52.apk
          sha256sum verified/BYDMate-DiLink3-build52.apk | tee verified/BYDMate-DiLink3-build52.sha256

      - name: Upload verified Build52 APK
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build52-byd-compatible
          path: verified/*
          if-no-files-found: error
          retention-days: 14
