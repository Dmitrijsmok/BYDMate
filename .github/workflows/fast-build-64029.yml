name: Fast build 64029 upstream 3.18.2 DiLink3 PTT

on:
  push:
    branches:
      - test/64029-upstream-3.18.2-dilink3-ptt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease --stacktrace
      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          INPUT_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$INPUT_APK"
          cp "$INPUT_APK" BYDMate-3.18.2-64029-DiLink3-PTT-unsigned.apk
          sha256sum BYDMate-3.18.2-64029-DiLink3-PTT-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.2-64029-DiLink3-PTT-unsigned
          path: BYDMate-3.18.2-64029-DiLink3-PTT-unsigned.apk
          if-no-files-found: error
          retention-days: 2
