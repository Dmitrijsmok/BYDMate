name: Build72 DiLink3 agent routing field test

on:
  push:
    branches:
      - dilink3-build72-agent-routing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dilink3-build72-agent-routing
  cancel-in-progress: true

jobs:
  build72:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean production source
        uses: actions/checkout@v7
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Fetch Build70/71/72 support files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dilink3-build70-fixed dilink3-build71-ai-ui dilink3-build72-agent-routing dilink3-build66-wizard
          git show origin/dilink3-build70-fixed:.github/dilink3-build70-fixes.py > /tmp/build70.py
          git show origin/dilink3-build71-ai-ui:.github/dilink3-build71-fixes.py > /tmp/build71.py
          git show origin/dilink3-build72-agent-routing:.github/dilink3-build72-fixes.py > /tmp/build72.py
          git show origin/dilink3-build66-wizard:.github/dilink3-debug.keystore.b64 > /tmp/dilink3-debug.keystore.b64

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Preflight patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/build70.py
          python3 -m py_compile /tmp/build71.py
          python3 -m py_compile /tmp/build72.py
          test "$(git branch --show-current)" = "dilink3-production-v3143"
          test -z "$(git status --porcelain)"

      - name: Apply verified Build70 field fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/dilink3-debug.keystore.b64 > /tmp/dilink3-field-test.keystore
          python3 /tmp/build70.py

      - name: Apply Build71 AI UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/build71.py

      - name: Apply Build72 routing and model fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/build72.py
          git diff --check

      - name: Verify Build72 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 60022' app/build.gradle.kts
          grep -F 'BYDMate DiLink3 Build72' app/src/main/AndroidManifest.xml
          grep -F 'openai/gpt-oss-20b' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'grok-4.6' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'gemini-3.8-flash' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'deepseek-v4-flash' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'groq/compound' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'settings_agent_compat_ok_primary' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'KEY_AGENT_PRIMARY_CONN' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'BUILD72_AGENT_ROUTE' app/src/main/kotlin/com/bydmate/app/agent/LlmAgentBackend.kt
          grep -F 'BUILD72_PTT' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          grep -F 'fun filesReady()' app/src/main/kotlin/com/bydmate/app/voice/ContinuousAsr.kt
          grep -F 'DILINK3_STOCK_ASSISTANT_KEYCODE' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -F 'bydmate_h70' app/src/main/kotlin/com/bydmate/app/helper/HelperBinderProtocol.kt
          if grep -R -F 'setAppHidden("com.byd.vrassistant", true)' app/src/main/kotlin; then
            echo 'Build72 must not disable vrassistant package' >&2
            exit 1
          fi

      - name: Compile and run focused regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.GigaAmModelManagerTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest' \
            --stacktrace

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity signer and upgrade path
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"

          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60022'" /tmp/badging
          grep -F "application-label:'BYDMate DiLink3 Build72'" /tmp/badging

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer
          grep -Fi 'certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' /tmp/signer
          test 60022 -gt 60021

          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build72.apk
          sha256sum verified/BYDMate-DiLink3-Build72.apk | tee verified/BYDMate-DiLink3-Build72.sha256

      - name: Build metadata
        shell: bash
        run: |
          cat > verified/BUILD72.txt <<'EOF'
          BYDMate DiLink3 Build72
          base=v3.14.3
          sourceBranch=dilink3-production-v3143
          package=com.bydmate.app.dilink3prodtest
          previousVersionCode=60021
          versionCode=60022
          steering=unchanged verified Build70 304 trigger + early 327 blocker
          ai=compatibility success selects the tested connection as Voice Agent primary
          models=provider catalogs merged with live /models; non-agent/audio/image/embedding models filtered
          providers=OpenAI Groq xAI/Grok Gemini Together DeepSeek Mistral plus existing presets
          voice=runtime logs expose ASR file/readiness TTS readiness and exact LLM route without API keys
          gigaam=distinguish installed files from runtime engine blocked by native-load guard
          EOF

      - name: Upload Build72
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build72
          path: verified/
          retention-days: 14
