name: Alice Build 2 Browser Accessibility

on:
  push:
    branches: [alice-build2-browser-accessibility]
  workflow_dispatch:

concurrency:
  group: alice-build2-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Alice Build 1 diagnostics patch
        run: python3 .github/alice-build1-patch.py

      - name: Apply Alice 1 side-by-side app identity
        run: python3 .github/alice-sideby-identity.py

      - name: Isolate Alice 1 helper resources
        run: python3 .github/alice-sideby-helper.py

      - name: Promote identity to Alice Build 2
        run: python3 .github/alice-build2-identity.py

      - name: Apply Alice Browser + Accessibility route
        run: python3 .github/alice-build2-browser.py

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Alice Build 2 Browser APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build2-Browser
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
