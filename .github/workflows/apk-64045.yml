name: APK 64045 Rebase 3.19

on:
  push:
    branches:
      - rebase/64045-author-3.19

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify rebase invariants
        run: |
          grep -q 'versionCode = 64045' app/build.gradle.kts
          grep -q 'versionName = "3.19.0"' app/build.gradle.kts
          grep -q 'resolveBydNaviStream' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt
          grep -q 'setLegacyStreamType(streamType)' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt
          grep -q 'private val playbackWorker = Executors.newSingleThreadExecutor' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt
          grep -q 'sentence N+1 can synthesize' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt
          grep -q 'MicSourceProbe' app/src/main/kotlin/com/bydmate/app/voice/AudioCapture.kt
          grep -q 'reply prewarm: live microphone confirmed' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          if grep -q 'prewarmNetwork()' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt; then
            echo 'Unsafe PTT prewarmNetwork present in VoiceController'
            exit 1
          fi
          grep -q 'private class FrameMark' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          grep -q 'onPlaybackOverlapped' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          grep -q 'replaceInFlight' app/src/main/kotlin/com/bydmate/app/voice/online/TtsRouter.kt
      - name: Targeted voice tests
        run: |
          ./gradlew :app:testDebugUnitTest             --tests com.bydmate.app.voice.SherpaTtsEngineTest             --tests com.bydmate.app.voice.VoiceControllerSessionTest             --tests com.bydmate.app.voice.VoiceControllerPlaybackBargeInTest             --tests com.bydmate.app.voice.AudioCaptureDuckTest             --tests com.bydmate.app.voice.GigaAmSegmenterTest             --tests com.bydmate.app.voice.online.TtsRouterTest             --tests com.bydmate.app.voice.online.TtsRouterInFlightTest             --stacktrace
      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Stage
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BYDMate-3.19.0-64045-Rebase-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.19.0-64045-Rebase-debug
          path: out/BYDMate-3.19.0-64045-Rebase-debug.apk
          retention-days: 2
      - name: Export signing tools
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$BT/apksigner" "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          cp "$BT/lib64/libc++_shared.so" signing-tools/lib64/ 2>/dev/null || true
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools-64045
          path: signing-tools
          retention-days: 2
