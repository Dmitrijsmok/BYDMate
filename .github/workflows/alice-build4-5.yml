name: Alice Build 4.5 Build95 Recovery

on:
  push:
    branches: [alice-build4-5]
  workflow_dispatch:

concurrency:
  group: alice-build4-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Build 1
        run: python3 .github/alice-build1-patch.py
      - name: Apply side-by-side identity
        run: python3 .github/alice-sideby-identity.py
      - name: Apply helper identity
        run: python3 .github/alice-sideby-helper.py
      - name: Apply Build 2 identity
        run: python3 .github/alice-build2-identity.py
      - name: Apply Browser base
        run: python3 .github/alice-build2-browser.py
      - name: Apply Build 3 identity
        run: python3 .github/alice-build3-identity.py
      - name: Apply DiLink3 route
        run: python3 .github/alice-build3-decision.py
      - name: Apply setting bridge
        run: python3 .github/alice-build3-toggle-mirror.py
      - name: Apply Browser correction
        run: python3 .github/alice-build3-browserfix.py
      - name: Apply Build 4
        run: python3 .github/alice-build4-runner.py
      - name: Apply Build 4.4 base
        run: python3 .github/alice-build4-4-runner.py
      - name: Apply Build 4.5 vrassistant helper
        run: python3 .github/alice-build4-5-vrassistant-helper.py
      - name: Apply Build 4.5 main recovery
        run: python3 .github/alice-build4-5-main-without-helper.py
      - name: Check patch whitespace
        run: git diff --check

      - name: Verify Build 4.5
        run: |
          grep -R 'applicationId = "com.bydmate.app.alice4"' app/build.gradle.kts
          grep -R 'versionCode = 64006' app/build.gradle.kts
          grep -R '3.15.2-alice4.5-build95-recovery' app/build.gradle.kts
          grep -R 'ALICE4_5_BOOT_PREWARM_DISABLED' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          ! grep -R 'ALICE4_4_SILENT_PREWARM requested=true' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -R 'pkg == "com.byd.vrassistant"' app/src/main/kotlin/com/bydmate/app/helper/HelperDaemon.kt
          grep -R 'ALICE4_5_COLD_ENTRY_CLICK' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_5_COLD_SURFACE_PRIMED' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_5_LISTENING_ACTIVATE' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_5_STOCK_ASSISTANT_BACK' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_5_DUCK' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'DILINK3_327_BLOCKED' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_4_A11Y_RECOVERY' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -R 'smartHomeUnlockedForTest = true' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build4-5-Build95-Recovery
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
