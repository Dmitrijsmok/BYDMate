name: Build70 DiLink3 fixed field test

on:
  push:
    branches:
      - dilink3-build70-fixed
    paths:
      - .github/dilink3-build70-fixes.py
      - .github/workflows/dilink3-build70-fixed.yml
  workflow_dispatch:

concurrency:
  group: dilink3-build70-fixed
  cancel-in-progress: true

jobs:
  build70:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout clean production source
        uses: actions/checkout@v7
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Fetch Build70 support files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dilink3-build70-fixed dilink3-build66-wizard
          git show origin/dilink3-build70-fixed:.github/dilink3-build70-fixes.py > /tmp/build70.py
          git show origin/dilink3-build70-fixed:.github/workflows/dilink3-build70-fixed.yml > /tmp/build70.yml
          git show origin/dilink3-build66-wizard:.github/dilink3-debug.keystore.b64 > /tmp/dilink3-debug.keystore.b64

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Preflight patch and workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/build70.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "workflow YAML OK"' /tmp/build70.yml
          test "$(git branch --show-current)" = "dilink3-production-v3143"
          test -z "$(git status --porcelain)"

      - name: Prepare signed Build70 and apply fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/dilink3-debug.keystore.b64 > /tmp/dilink3-field-test.keystore
          python3 /tmp/build70.py
          git diff --check

      - name: Verify Build70 source invariants
        shell: bash
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts
          PROTOCOL=app/src/main/kotlin/com/bydmate/app/helper/HelperBinderProtocol.kt
          DAEMON=app/src/main/kotlin/com/bydmate/app/helper/HelperDaemon.kt
          ADB=app/src/main/kotlin/com/bydmate/app/data/autoservice/AdbOnDeviceClient.kt
          STEERING=app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          GIGA=app/src/main/kotlin/com/bydmate/app/voice/GigaAmModelManager.kt
          VM=app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          UI=app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt

          grep -Fq 'versionCode = 60020' "$GRADLE"
          grep -Fq 'applicationIdSuffix = ".dilink3prodtest"' "$GRADLE"
          grep -Fq 'const val SERVICE_NAME = "bydmate_h70"' "$PROTOCOL"
          grep -Fq 'const val PROCESS_NAME = "bydmate_h70"' "$PROTOCOL"
          grep -Fq 'const val APP_PACKAGE = "com.bydmate.app.dilink3prodtest"' "$PROTOCOL"
          grep -Fq 'private const val LOCK_PATH = "/data/local/tmp/bydmate_h70.lock"' "$DAEMON"
          grep -Fq 'private const val HELPER_PROCESS_NAME = "bydmate_h70"' "$ADB"
          grep -Fq 'private const val HELPER_LOG_PATH = "/data/local/tmp/bydmate_h70.log"' "$ADB"
          grep -Fq 'BUILD70_327_CONSUMED' "$STEERING"
          grep -Fq 'event.keyCode == DILINK3_STOCK_ASSISTANT_KEYCODE' "$STEERING"
          grep -Fq 'gigaAmDownloadPhase' "$VM"
          grep -Fq 'unpacking GigaAM archive' "$GIGA"
          grep -Fq 'downloading Silero VAD' "$GIGA"
          grep -Fq 'GigaAM debug:' "$UI"
          grep -Fq 'Build70 debug: helper=bydmate_h70' "$UI"

          # OFF must remain fail-open: no package-disable is introduced by Build70.
          if grep -R -F 'setAppHidden("com.byd.vrassistant", true)' app/src/main/kotlin; then
            echo 'Build70 must not disable vrassistant package' >&2
            exit 1
          fi

      - name: Compile and run focused regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.GigaAmModelManagerTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest' \
            --stacktrace

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity signer and upgrade path
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"

          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60020'" /tmp/badging
          grep -F "application-label:'BYDMate DiLink3 Build70'" /tmp/badging

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer
          grep -Fi 'certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' /tmp/signer

          # Explicit regression guard: Build69 used this package/signer with versionCode 60019.
          test 60020 -gt 60019

          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build70.apk
          sha256sum verified/BYDMate-DiLink3-Build70.apk | tee verified/BYDMate-DiLink3-Build70.sha256
          printf '%s\n' \
            'base=v3.14.3' \
            'sourceBranch=dilink3-production-v3143' \
            'package=com.bydmate.app.dilink3prodtest' \
            'previousVersionCode=60019' \
            'versionCode=60020' \
            'signerSha256=c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' \
            'upgradePath=installs over Build69 without uninstall/data loss' \
            'helper=isolated service/process/lock/log namespace bydmate_h70' \
            'switchON=304 triggers BYDMate; 327 is consumed by an early Build49-style gate' \
            'switchOFF=304 and 327 pass through to stock BYD Assistant' \
            'gigaam=visible persistent phase + percentage diagnostics' > verified/BUILD70.txt

      - name: Upload Build70
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build70
          path: verified/
          retention-days: 14
