name: Alice Build 4.1

on:
  push:
    branches: [alice-build4-1-yandex-handoff]
  workflow_dispatch:

concurrency:
  group: alice-build4-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Build 1
        run: python3 .github/alice-build1-patch.py

      - name: Apply side-by-side identity
        run: python3 .github/alice-sideby-identity.py

      - name: Apply helper identity
        run: python3 .github/alice-sideby-helper.py

      - name: Apply Build 2 identity
        run: python3 .github/alice-build2-identity.py

      - name: Apply Browser base
        run: python3 .github/alice-build2-browser.py

      - name: Apply Build 3 identity
        run: python3 .github/alice-build3-identity.py

      - name: Apply DiLink3 route
        run: python3 .github/alice-build3-decision.py

      - name: Apply setting bridge
        run: python3 .github/alice-build3-toggle-mirror.py

      - name: Apply Browser correction
        run: python3 .github/alice-build3-browserfix.py

      - name: Apply Build 4
        run: python3 .github/alice-build4-runner.py

      - name: Apply Build 4.1 staged handoff
        run: python3 .github/alice-build4-1-yandex-handoff.py

      - name: Verify Build 4.1
        run: |
          grep -R 'applicationId = "com.bydmate.app.alice4"' app/build.gradle.kts
          grep -R 'versionCode = 64002' app/build.gradle.kts
          grep -R '3.15.2-alice4.1-handoff' app/build.gradle.kts
          grep -R 'bro_omnibox_button_microphone' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_1_COLD_ENTRY_CLICKED' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'ALICE4_1_LISTENING_CLICK' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'YANDEX_A11Y_CANDIDATE' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R 'alice_native_takeover' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -R 'smartHomeUnlockedForTest = true' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build4-1
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
