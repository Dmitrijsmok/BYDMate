name: Alice Build 3 DiLink3 Takeover

on:
  push:
    branches: [alice-build3-dilink3-takeover]
  workflow_dispatch:

concurrency:
  group: alice-build3-dilink3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Alice Build 1 diagnostics and Smart Home visibility
        run: python3 .github/alice-build1-patch.py

      - name: Apply Alice 1 side-by-side identity
        run: python3 .github/alice-sideby-identity.py

      - name: Isolate Alice helper resources
        run: python3 .github/alice-sideby-helper.py

      - name: Promote identity to Alice Build 2
        run: python3 .github/alice-build2-identity.py

      - name: Apply Browser Accessibility base route
        run: python3 .github/alice-build2-browser.py

      - name: Promote identity to Alice Build 3
        run: python3 .github/alice-build3-identity.py

      - name: Apply DiLink3 304 and 327 decision
        run: python3 .github/alice-build3-decision.py

      - name: Bind route to native assistant toggle
        run: python3 .github/alice-build3-toggle-mirror.py

      - name: Restore exact Build95 toolbar Alice route
        run: python3 .github/alice-build3-browserfix.py

      - name: Verify Build 3 source markers
        run: |
          grep -R "DILINK3_ALICE_ROUTE = 1304" app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyDecision.kt
          grep -R "alice_input_quarknyx" app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R "ALICE_TOOLBAR_EXACT_NOT_FOUND" app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -R "apkpure.com/yandex-browser-with-protect/com.yandex.browser" app/src/main/kotlin/com/bydmate/app/AliceSetupActivity.kt
          grep -R "smartHomeUnlockedForTest = true" app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Alice Build 3 APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build3-DiLink3
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
