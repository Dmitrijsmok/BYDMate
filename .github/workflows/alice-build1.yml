name: Alice Build 1

on:
  push:
    branches: [alice-author-v3152-test]
  workflow_dispatch:

concurrency:
  group: alice-build1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Alice Build 1 patch
        run: python3 .github/alice-build1-patch.py

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Alice Build 1 APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build1
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
