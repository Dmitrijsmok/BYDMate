name: Alice Build 1 Side-by-Side

on:
  push:
    branches: [alice-build1-side-by-side-final2]
  workflow_dispatch:

concurrency:
  group: alice-build1-sbs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Apply Alice Build 1 diagnostics patch
        run: python3 .github/alice-build1-patch.py

      - name: Apply side-by-side app identity
        run: python3 .github/alice-sideby-identity.py

      - name: Isolate Alice helper resources
        run: python3 .github/alice-sideby-helper.py

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Alice Build 1 Side-by-Side APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-Alice-Build1-SideBySide
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
