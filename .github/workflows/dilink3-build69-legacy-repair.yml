name: Build69 DiLink3 legacy repair production test

on:
  push:
    branches:
      - dilink3-build69-legacy-repair
    paths:
      - .github/dilink3-build69-legacy-repair.py
      - .github/dilink3-build69-prepare-apk.py
      - .github/workflows/dilink3-build69-legacy-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dilink3-build69-legacy-repair
  cancel-in-progress: true

jobs:
  build69:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout clean production source
        uses: actions/checkout@v7
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Fetch Build69 support files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dilink3-build69-legacy-repair dilink3-build66-wizard
          git show origin/dilink3-build69-legacy-repair:.github/dilink3-build69-legacy-repair.py > /tmp/build69.py
          git show origin/dilink3-build69-legacy-repair:.github/dilink3-build69-prepare-apk.py > /tmp/build69-prepare.py
          git show origin/dilink3-build69-legacy-repair:.github/workflows/dilink3-build69-legacy-repair.yml > /tmp/build69.yml
          git show origin/dilink3-build66-wizard:.github/dilink3-debug.keystore.b64 > /tmp/dilink3-debug.keystore.b64

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Preflight workflow and patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/build69.py /tmp/build69-prepare.py
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "workflow YAML OK"' /tmp/build69.yml
          test "$(git branch --show-current)" = "dilink3-production-v3143"
          test -z "$(git status --porcelain)"

      - name: Apply or verify legacy-state repair
        run: python3 /tmp/build69.py

      - name: Preflight formatting and production invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          HELPER=app/src/main/kotlin/com/bydmate/app/helper/HelperDaemon.kt
          TRACKING=app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          STEERING=app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          EARCON=app/src/main/kotlin/com/bydmate/app/voice/VoiceEarcon.kt
          ROWS=app/src/main/kotlin/com/bydmate/app/ui/settings/SettingRows.kt

          grep -Fq 'pkg == "com.byd.vrassistant" && hidden == 0' "$HELPER"
          grep -Fq 'legacy_diag_stock_assistant_restored_v1' "$TRACKING"
          grep -Fq 'helperClient.setAppHidden("com.byd.vrassistant", false)' "$TRACKING"
          grep -Fq 'helperClient.setAppHidden("com.byd.autovoice", false)' "$TRACKING"
          grep -Fq 'com.bydmate.app.dilink3diag/com.bydmate.app.cluster.SteeringWheelKeyService' "$HELPER"

          grep -Fq 'val diLink3Takeover = diLink3Platform && voiceEnabled' "$STEERING"
          grep -Fq 'VoiceEarcon().steeringStart()' "$STEERING"
          grep -Fq 'fun steeringStart()' "$EARCON"
          grep -Fq 'options == listOf("BYD Assistant", "BYDMate")) return' "$ROWS"

          if grep -R -E 'BUILD5[0-9]_|BUILD6[0-8]_|PRODUCTION WIZARD|ПОШАГОВАЯ ДИАГНОСТИКА' app/src/main/kotlin; then
            echo 'Debug or diagnostic code leaked into production source' >&2
            exit 1
          fi
          if grep -R -F 'setAppHidden("com.byd.vrassistant", true)' app/src/main/kotlin; then
            echo 'Production is attempting to disable vrassistant' >&2
            exit 1
          fi

          ./gradlew --no-daemon help >/dev/null

      - name: Compile and run focused regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.voice.GigaAmModelManagerTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest' \
            --stacktrace

      - name: Commit verified repair to production branch if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/bydmate/app/helper/HelperDaemon.kt \
                  app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          if git diff --cached --quiet; then
            echo 'Production branch already contains the verified Build69 repair'
          else
            git commit -m 'fix(dilink3): repair persistent state left by legacy diagnostics'
            git push origin HEAD:dilink3-production-v3143
          fi

      - name: Prepare reproducibly signed Build69 field APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/dilink3-debug.keystore.b64 > /tmp/dilink3-field-test.keystore
          python3 /tmp/build69-prepare.py
          git diff --check

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity signer and contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"

          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60019'" /tmp/badging
          grep -F "application-label:'BYDMate DiLink3 Build69'" /tmp/badging

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer
          grep -Fi 'certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' /tmp/signer

          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build69.apk
          sha256sum verified/BYDMate-DiLink3-Build69.apk | tee verified/BYDMate-DiLink3-Build69.sha256
          printf '%s\n' \
            'base=v3.14.3' \
            'sourceBranch=dilink3-production-v3143' \
            'package=com.bydmate.app.dilink3prodtest' \
            'versionCode=60019' \
            'signerSha256=c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' \
            'migration=one-time restore of legacy vrassistant/autovoice package state plus stale diagnostic a11y cleanup' \
            'ui=one BYDMate Assistant switch on DiLink3' \
            'switchON=304 -> immediate beep -> BYDMate; 327 consumed' \
            'switchOFF=304 and 327 pass through to stock BYD Assistant' \
            'voice=GigaAM -> agent/API -> TTS' > verified/BUILD69.txt

      - name: Upload Build69
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build69
          path: verified/
          retention-days: 14
