name: Build71 DiLink3 AI UI field test

on:
  push:
    branches:
      - dilink3-build71-ai-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dilink3-build71-ai-ui
  cancel-in-progress: true

jobs:
  build71:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean production source
        uses: actions/checkout@v7
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Fetch Build70/71 support files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dilink3-build70-fixed dilink3-build71-ai-ui dilink3-build66-wizard
          git show origin/dilink3-build70-fixed:.github/dilink3-build70-fixes.py > /tmp/build70.py
          git show origin/dilink3-build71-ai-ui:.github/dilink3-build71-fixes.py > /tmp/build71.py
          git show origin/dilink3-build66-wizard:.github/dilink3-debug.keystore.b64 > /tmp/dilink3-debug.keystore.b64

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Preflight patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/build70.py
          python3 -m py_compile /tmp/build71.py
          test "$(git branch --show-current)" = "dilink3-production-v3143"
          test -z "$(git status --porcelain)"

      - name: Apply Build70 verified field fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/dilink3-debug.keystore.b64 > /tmp/dilink3-field-test.keystore
          python3 /tmp/build70.py

      - name: Apply Build71 minimal fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/build71.py
          git diff --check

      - name: Verify Build71 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 60021' app/build.gradle.kts
          grep -F 'BYDMate DiLink3 Build71' app/src/main/AndroidManifest.xml
          grep -F 'https://api.groq.com/openai/v1' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt
          grep -F 'https://api.x.ai/v1' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt
          grep -F 'testAgentCompatibility' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'Требуется перезапуск системы' app/src/main/res/values/strings.xml
          grep -F 'System restart required' app/src/main/res/values-en/strings.xml
          grep -F 'refreshGigaAmStatus' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'bydmate_h70' app/src/main/kotlin/com/bydmate/app/helper/HelperBinderProtocol.kt
          grep -F 'DILINK3_STOCK_ASSISTANT_KEYCODE' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          if grep -R -F 'setAppHidden("com.byd.vrassistant", true)' app/src/main/kotlin; then
            echo 'Build71 must not disable vrassistant package' >&2
            exit 1
          fi

      - name: Compile and run focused regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.GigaAmModelManagerTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest' \
            --stacktrace

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity signer and upgrade path
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"

          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60021'" /tmp/badging
          grep -F "application-label:'BYDMate DiLink3 Build71'" /tmp/badging

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer
          grep -Fi 'certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' /tmp/signer
          test 60021 -gt 60020

          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build71.apk
          sha256sum verified/BYDMate-DiLink3-Build71.apk | tee verified/BYDMate-DiLink3-Build71.sha256

      - name: Build metadata
        shell: bash
        run: |
          cat > verified/BUILD71.txt <<'EOF'
          BYDMate DiLink3 Build71
          base=v3.14.3
          sourceBranch=dilink3-production-v3143
          package=com.bydmate.app.dilink3prodtest
          previousVersionCode=60020
          versionCode=60021
          changes=minimal UI/status patch on top of verified Build70 steering routing
          ai=OpenAI-compatible presets + one Agent compatibility tool-call test
          steering=human-readable BYD Assistant status + system restart required hint when enabled but a11y not connected
          gigaam=manual status re-check; actual installed files override stale 93/99 percent UI state
          localization=Russian + English for new short debug/status strings only
          EOF

      - name: Upload Build71
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build71
          path: verified/
          retention-days: 14
