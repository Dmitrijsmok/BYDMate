name: Alice integration audit

on:
  push:
    branches: [alice-public-integration-v3.17.3]
  workflow_dispatch:

concurrency:
  group: alice-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check Alice reference bridge syntax
        run: |
          node --check reference/alice-worker/worker.mjs
          node --check reference/alice-worker/server.mjs
          node --check reference/alice-worker/d1-sqlite.mjs
      - name: Build unoptimized debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload unoptimized debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-fork-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: detekt
        run: ./gradlew :app:detekt --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: alice-audit-reports-${{ github.sha }}
          path: app/build/reports/
          retention-days: 14
