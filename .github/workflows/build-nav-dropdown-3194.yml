name: Build 3.19.4 navigator dropdown

on:
  push:
    branches:
      - feat/navigation-dropdown-v3.19.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BYDMATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BYDMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BYDMATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BYDMATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/bydmate-release.jks
          cat > keystore.properties <<EOF
          storeFile=bydmate-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Navigation regression tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.bydmate.app.data.automation.RouteNavigatorUrisTest \
            --tests com.bydmate.app.data.automation.ActionDispatcherNavigateTest \
            --tests com.bydmate.app.agent.AgentToolsNavigateAppTest \
            --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Build signed debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify permanent APK signer
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.BYDMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BYDMATE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          APK_SHA="$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')"
          KEY_SHA="$(LC_ALL=C keytool -list -v -keystore app/bydmate-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$APK_SHA"
          test -n "$KEY_SHA"
          test "$APK_SHA" = "$KEY_SHA"
          echo "Verified signer SHA-256: $APK_SHA"

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          cp "$APK" out/BYDMate-3.19.4-64049-NavDropdown-debug.apk
          sha256sum out/BYDMate-3.19.4-64049-NavDropdown-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.19.4-64049-NavDropdown-debug
          path: out/BYDMate-3.19.4-64049-NavDropdown-debug.apk
          if-no-files-found: error
          retention-days: 14
