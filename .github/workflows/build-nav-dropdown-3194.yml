name: Build 3.19.4 navigator dropdown

on:
  push:
    branches:
      - feat/navigation-dropdown-v3.19.4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-dropdown-3194-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Navigation regression tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.bydmate.app.data.automation.RouteNavigatorUrisTest \
            --tests com.bydmate.app.data.automation.ActionDispatcherNavigateTest \
            --tests com.bydmate.app.agent.AgentToolsNavigateAppTest \
            --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p bundle/apk bundle/signing-tools/lib
          cp "$APK" bundle/apk/BYDMate-3.19.4-64049-NavDropdown-ci-debug.apk
          sha256sum bundle/apk/BYDMate-3.19.4-64049-NavDropdown-ci-debug.apk

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BT/apksigner" "$BT/zipalign" "$BT/aapt" bundle/signing-tools/
          cp "$BT/lib/apksigner.jar" bundle/signing-tools/lib/
          chmod +x bundle/signing-tools/apksigner bundle/signing-tools/zipalign bundle/signing-tools/aapt

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.19.4-64049-NavDropdown-ci
          path: bundle
          if-no-files-found: error
          retention-days: 14
