name: Finalize DiLink3 production v3

on:
  push:
    branches: [dilink3-v3143-finalize-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Fetch finalizer
        shell: bash
        run: |
          git fetch origin dilink3-v3143-finalize-migration
          git show origin/dilink3-v3143-finalize-migration:.github/dilink3-finalize-v3143.py > /tmp/dilink3-finalize-v3143.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply clean production patch
        run: python3 /tmp/dilink3-finalize-v3143.py

      - name: Verify production invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'fun diLink3TakeoverSupported' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyDecision.kt
          grep -Fq 'onSteeringPttPressed()' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -Fq 'if (!diLink3Platform)' app/src/main/kotlin/com/bydmate/app/cluster/SteeringWheelKeyService.kt
          grep -Fq 'oneShotAfterFirstUtterance' app/src/main/kotlin/com/bydmate/app/voice/VoiceController.kt
          grep -Fq 'options = listOf("BYD Assistant", "BYDMate")' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt
          grep -Fq 'setAppHidden("com.byd.autovoice", false)' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          if grep -Fq 'setAppHidden("com.byd.autovoice", pref == "true")' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt; then
            echo 'legacy package disable path remains' >&2
            exit 1
          fi
          if grep -R -E 'BUILD5[0-9]_|BUILD6[0-9]_|PRODUCTION WIZARD|ПОШАГОВАЯ ДИАГНОСТИКА' app/src/main/kotlin; then
            echo 'debug BuildXX code leaked into production source' >&2
            exit 1
          fi

      - name: Compile and run focused regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.voice.GigaAmModelManagerTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest'

      - name: Commit verified production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/test
          git commit -m 'feat(dilink3): finalize clean steering voice production flow'
          git push origin HEAD:dilink3-production-v3143

      - name: Prepare side-by-side field-test identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          anchor = '''    buildTypes {
              release {
          '''
          anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in anchor.splitlines()) + '\n'
          repl = '''    buildTypes {
              debug {
                  applicationIdSuffix = ".dilink3prodtest"
                  versionNameSuffix = "-dilink3-production-test"
              }
              release {
          '''
          repl = '\n'.join(line[10:] if line.startswith('          ') else line for line in repl.splitlines()) + '\n'
          if anchor not in s:
              raise SystemExit('buildTypes anchor missing')
          s = s.replace(anchor, repl, 1)
          if '        versionCode = 443' not in s:
              raise SystemExit('versionCode anchor missing')
          s = s.replace('        versionCode = 443', '        versionCode = 60017', 1)
          p.write_text(s)

          m = Path('app/src/main/AndroidManifest.xml')
          t = m.read_text()
          if 'android:label="BYDMate"' in t:
              m.write_text(t.replace('android:label="BYDMate"', 'android:label="BYDMate DiLink3 Production Test"', 1))
          PY

      - name: Build field-test APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60017'" /tmp/badging
          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build67-Production-Test.apk
          sha256sum verified/BYDMate-DiLink3-Build67-Production-Test.apk | tee verified/BYDMate-DiLink3-Build67-Production-Test.sha256
          printf '%s\n' \
            'base=v3.14.3' \
            'sourceBranch=dilink3-production-v3143' \
            'package=com.bydmate.app.dilink3prodtest' \
            'versionCode=60017' \
            'ui=clean production' \
            'steering=304 BYDMate / 327 blocked only when BYDMate selected' \
            'voice=one steering press -> one GigaAM utterance -> API -> TTS' > verified/BUILD67.txt

      - name: Upload Build67
        uses: actions/upload-artifact@v4
        with:
          name: bydmate-dilink3-build67-production-test
          path: verified/
          retention-days: 14
