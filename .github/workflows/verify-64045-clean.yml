name: Verify 64045 Author 3.19 Four Invariants

on:
  push:
    branches:
      - release/64045-author319-four-invariants

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Full verification
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:detekt --stacktrace
