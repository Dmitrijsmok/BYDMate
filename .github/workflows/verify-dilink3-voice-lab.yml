name: Verify DiLink3 Voice Lab

on:
  push:
    branches:
      - lab/3.18-dilink3-local-voice
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dilink3-voice-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Build Lab APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Lab package identity
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.bydmate.app.lab'" /tmp/badging.txt
          grep -q "application-label:'BYDMate Lab'" /tmp/badging.txt

      - name: Upload Lab APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.0-DiLink3-Voice-Lab
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dilink3-voice-lab-reports
          path: app/build/reports/
          retention-days: 7
