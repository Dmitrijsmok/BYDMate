name: Fast APK 64047

on:
  push:
    branches:
      - release/64047-fast-tts-chunker

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK only
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BYDMate-3.19.0-64047-FastTtsChunker-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.19.0-64047-FastTtsChunker-debug
          path: out/BYDMate-3.19.0-64047-FastTtsChunker-debug.apk
          retention-days: 2
