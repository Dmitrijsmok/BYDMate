name: Verify 64044

on:
  push:
    branches:
      - quick/64044-safe-latency-prewarm

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Full verification
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:detekt --stacktrace
