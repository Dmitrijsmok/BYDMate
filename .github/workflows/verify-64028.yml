name: Verify and build 64028 upstream 3.18.1

on:
  push:
    branches:
      - test/64028-upstream-3.18.1-no-alice

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: detekt
        run: ./gradlew :app:detekt --stacktrace
      - name: Build upstream debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Sign with stable BYDMate test key
        env:
          KEYSTORE_B64: ${{ secrets.BYDMATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BYDMATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BYDMATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BYDMATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bydmate-stable.jks"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          INPUT_APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$INPUT_APK"
          "$TOOLS_DIR/zipalign" -f -p 4 "$INPUT_APK" "$RUNNER_TEMP/BYDMate-3.18.1-64028-aligned.apk"
          "$TOOLS_DIR/apksigner" sign             --ks "$RUNNER_TEMP/bydmate-stable.jks"             --ks-pass "pass:$STORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out "BYDMate-3.18.1-64028-Upstream-No-Alice.apk"             "$RUNNER_TEMP/BYDMate-3.18.1-64028-aligned.apk"
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs "BYDMate-3.18.1-64028-Upstream-No-Alice.apk"
          "$TOOLS_DIR/zipalign" -c -v 4 "BYDMate-3.18.1-64028-Upstream-No-Alice.apk"
          sha256sum "BYDMate-3.18.1-64028-Upstream-No-Alice.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.1-64028-Upstream-No-Alice
          path: BYDMate-3.18.1-64028-Upstream-No-Alice.apk
          if-no-files-found: error
          retention-days: 2
