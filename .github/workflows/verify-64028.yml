name: Verify and build 64028 upstream 3.18.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: detekt
        run: ./gradlew :app:detekt --stacktrace
      - name: Build upstream release APK
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease --stacktrace
