name: Fast build 64028 upstream 3.18.1

on:
  push:
    branches:
      - test/64028-upstream-3.18.1-no-alice

permissions:
  contents: read

jobs:
  fast-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build test APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS_DIR/aapt" dump badging "$APK" | head -1
          cp "$APK" BYDMate-3.18.1-64028-Upstream-No-Alice-UNSIGNED.apk
          sha256sum BYDMate-3.18.1-64028-Upstream-No-Alice-UNSIGNED.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.1-64028-Upstream-No-Alice-UNSIGNED
          path: BYDMate-3.18.1-64028-Upstream-No-Alice-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 2
