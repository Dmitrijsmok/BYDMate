name: Fast build 64028 upstream 3.18.1 release

on:
  push:
    branches:
      - test/64028-upstream-3.18.1-no-alice

permissions:
  contents: read

jobs:
  fast-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease --stacktrace

      - name: Prepare unsigned release artifact
        shell: bash
        run: |
          set -euo pipefail
          INPUT_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$INPUT_APK"
          cp "$INPUT_APK" BYDMate-3.18.1-64028-Upstream-No-Alice-unsigned.apk
          sha256sum BYDMate-3.18.1-64028-Upstream-No-Alice-unsigned.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.1-64028-Upstream-No-Alice-unsigned
          path: BYDMate-3.18.1-64028-Upstream-No-Alice-unsigned.apk
          if-no-files-found: error
          retention-days: 2
