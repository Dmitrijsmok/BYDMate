name: Build96 DiLink3 Rebase v3.15.2

on:
  push:
    branches:
      - build96
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dilink3-build96-rebase-v3152
  cancel-in-progress: true

jobs:
  build96:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Build96 control branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase Build95 field delta onto upstream v3.15.2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/dilink3-build96-rebase.py
          python3 .github/dilink3-build96-rebase.py

      - name: Verify Build96 and upstream Alice invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 60046' app/build.gradle.kts
          grep -F 'versionName = "3.15.2"' app/build.gradle.kts
          grep -F 'versionNameSuffix = "-dilink3-production-build96"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".dilink3prodtest"' app/build.gradle.kts
          grep -F 'android:label="BYDMate DiLink3 Build96"' app/src/main/AndroidManifest.xml

          # Frozen field behavior retained.
          grep -F 'build95_steering_owner_initialized' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'build95_steering_owner_initialized' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'ALICE95 304 ROUTE' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'ALICE95 327 BLOCK' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'val explicitRoute = consume304UntilUp || armedTarget != null' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'val block = hardWindow || owner' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt
          grep -F 'options = listOf("BYD Assistant", "BYDMate / Alice")' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt
          grep -F 'private fun sherpaThreadCount(): Int = 2' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt
          if grep -F 'BUILD82_STREAM_PREBUFFER_MS' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt; then exit 1; fi
          if grep -F 'coerceIn(2, 4)' app/src/main/kotlin/com/bydmate/app/voice/SherpaTtsEngine.kt; then exit 1; fi
          if grep -F 'FLAG_NOT_FOCUSABLE' app/src/main/kotlin/com/bydmate/app/assistantlab/AssistantLab.kt; then exit 1; fi

          # Author's hidden Smart Home / Alice bridge retained from upstream.
          grep -F 'SMART_HOME' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt
          grep -F 'onVersionTap = { viewModel.onVersionTap() }' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt
          grep -F 'if (versionTapCount >= 7)' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          grep -F 'KEY_ALICE_ENDPOINT' app/src/main/kotlin/com/bydmate/app/data/repository/SettingsRepository.kt
          grep -F 'KEY_ALICE_API_KEY' app/src/main/kotlin/com/bydmate/app/data/repository/SettingsRepository.kt
          grep -F '.url("$endpoint/api/poll")' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt
          grep -F '.url("$endpoint/api/state")' app/src/main/kotlin/com/bydmate/app/data/remote/AlicePollingManager.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile and run field regressions
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.voice.SherpaTtsEngineTest' \
            --tests 'com.bydmate.app.voice.GigaAmSegmenterTest' \
            --tests 'com.bydmate.app.voice.VoiceControllerAgentFallbackTest' \
            --tests 'com.bydmate.app.agent.AgentOrchestratorTest' \
            --tests 'com.bydmate.app.agent.LlmAgentBackendTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest' \
            --stacktrace

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK identity signer and upgrade path
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          BT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging
          grep -F "package: name='com.bydmate.app.dilink3prodtest' versionCode='60046'" /tmp/badging
          grep -F "application-label:'BYDMate DiLink3 Build96'" /tmp/badging
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signer
          grep -Fi 'certificate SHA-256 digest: c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb' /tmp/signer
          test 60046 -gt 60045
          mkdir -p verified
          cp "$APK" verified/BYDMate-DiLink3-Build96.apk
          sha256sum verified/BYDMate-DiLink3-Build96.apk | tee verified/BYDMate-DiLink3-Build96.sha256

      - name: Build metadata
        shell: bash
        run: |
          cat > verified/BUILD96.txt <<'EOF'
          BYDMate DiLink3 Build96
          upstreamBase=v3.15.2
          upstreamCommit=194d837f701d03fd24b50a9ea0bcd17b73e7fd5a
          fieldBaseline=Build95
          package=com.bydmate.app.dilink3prodtest
          previousVersionCode=60045
          versionCode=60046
          signerSha256=c5344459707bb536c688413acba4f9dff2308da925fe3b3659c5355d60e09aeb
          build85VoiceBaselineRetained=true
          build95SteeringOwnershipRetained=true
          browserAliceHandoffRetained=true
          stock327BlockRetained=true
          authorSmartHomeAliceBridgeRetained=true
          authorSmartHomeUnlock=7-version-taps
          alicePollingEndpoint=/api/poll
          aliceStateEndpoint=/api/state
          EOF

      - name: Upload Build96
        uses: actions/upload-artifact@v7
        with:
          name: bydmate-dilink3-build96
          path: verified/
          retention-days: 14
