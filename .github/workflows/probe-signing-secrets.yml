name: Probe signing secret names

on:
  push:
    branches:
      - probe/signing-secrets

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured secret names
        shell: bash
        env:
          S1: ${{ secrets.BYDMATE_KEYSTORE_BASE64 }}
          S2: ${{ secrets.BYDMATE_KEYSTORE_PASSWORD }}
          S3: ${{ secrets.BYDMATE_KEY_ALIAS }}
          S4: ${{ secrets.BYDMATE_KEY_PASSWORD }}
          S5: ${{ secrets.KEYSTORE_BASE64 }}
          S6: ${{ secrets.KEYSTORE_PASSWORD }}
          S7: ${{ secrets.KEY_ALIAS }}
          S8: ${{ secrets.KEY_PASSWORD }}
          S9: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S10: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S11: ${{ secrets.ANDROID_KEY_ALIAS }}
          S12: ${{ secrets.ANDROID_KEY_PASSWORD }}
          S13: ${{ secrets.SIGNING_KEY_BASE64 }}
          S14: ${{ secrets.SIGNING_KEY_PASSWORD }}
          S15: ${{ secrets.SIGNING_KEY_ALIAS }}
          S16: ${{ secrets.ALIAS_PASSWORD }}
          S17: ${{ secrets.BYDMATE_SIGNING_KEY_BASE64 }}
          S18: ${{ secrets.ALICE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          names=(
            BYDMATE_KEYSTORE_BASE64 BYDMATE_KEYSTORE_PASSWORD BYDMATE_KEY_ALIAS BYDMATE_KEY_PASSWORD
            KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            SIGNING_KEY_BASE64 SIGNING_KEY_PASSWORD SIGNING_KEY_ALIAS ALIAS_PASSWORD
            BYDMATE_SIGNING_KEY_BASE64 ALICE_KEYSTORE_BASE64
          )
          for i in $(seq 1 18); do
            v="S$i"
            if [ -n "${!v:-}" ]; then
              echo "${names[$((i-1))]}=SET"
            else
              echo "${names[$((i-1))]}=EMPTY"
            fi
          done
