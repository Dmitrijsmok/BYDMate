name: Verify 64031 overlay earcon local tts

on:
  push:
    branches:
      - fix/64031-upstream-3.18.2-local-voice-recovery

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Build full debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BYDMate-3.18.2-64031-OverlayEarconFix-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-3.18.2-64031-LocalVoiceFix-debug
          path: out/BYDMate-3.18.2-64031-LocalVoiceFix-debug.apk
          if-no-files-found: error
          retention-days: 2

      - name: Export Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" "$BT/zipalign" "$BT/aapt2" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign signing-tools/aapt2

      - uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools-64031
          path: signing-tools
          if-no-files-found: error
          retention-days: 2

# 64031 verification workflow
