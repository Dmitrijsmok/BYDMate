name: Apply lifecycle-safe GigaAM on v3.14.3

on:
  push:
    branches: [dilink3-v3143-gigaam-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-gigaam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dilink3-production-v3143
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply proven lifecycle-safe provisioning
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dilink3-production-orchestrator:dilink3-production-orchestrator
          git show dilink3-production-orchestrator:.github/workflows/dilink3-production-gigaam-v2.yml > /tmp/source.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/source.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          block = lines[start:end]
          normalized = [line[10:] if line.startswith('          ') else line for line in block]
          Path('/tmp/apply_gigaam.py').write_text('\n'.join(normalized) + '\n')
          PY
          python3 /tmp/apply_gigaam.py

      - name: Update GigaAM unit-test context for persistent provisioning state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/test/kotlin/com/bydmate/app/voice/GigaAmModelManagerTest.kt')
          s = p.read_text(encoding='utf-8')
          if 'import android.content.SharedPreferences\n' not in s:
              s = s.replace(
                  'import android.content.Context\n',
                  'import android.content.Context\nimport android.content.SharedPreferences\n',
                  1,
              )

          manager_pattern = re.compile(
              r'    private fun manager\(filesDir: File\): GigaAmModelManager \{\n'
              r'        val ctx = mockk<Context>\(\)\n'
              r'        every \{ ctx\.filesDir \} returns filesDir\n'
              r'        every \{ ctx\.cacheDir \} returns filesDir\n'
              r'        return GigaAmModelManager\(ctx, OkHttpClient\(\)\)\n'
              r'    \}\n'
          )
          replacement = '''    private fun contextFor(filesDir: File): Context {
              val ctx = mockk<Context>()
              val prefs = mockk<SharedPreferences>(relaxed = true)
              val editor = mockk<SharedPreferences.Editor>(relaxed = true)
              every { ctx.filesDir } returns filesDir
              every { ctx.cacheDir } returns filesDir
              every { ctx.getSharedPreferences("gigaam_provisioning", Context.MODE_PRIVATE) } returns prefs
              every { prefs.getInt(any(), any()) } returns -1
              every { prefs.getBoolean(any(), any()) } returns false
              every { prefs.edit() } returns editor
              every { editor.putInt(any(), any()) } returns editor
              every { editor.putBoolean(any(), any()) } returns editor
              every { editor.clear() } returns editor
              return ctx
          }

          private fun manager(filesDir: File): GigaAmModelManager =
              GigaAmModelManager(contextFor(filesDir), OkHttpClient())
          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          ) + '\n'
          s, n = manager_pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'manager(filesDir) test helper replacement count={n}')

          with_pattern = re.compile(
              r'    private fun managerWith\(filesDir: File, http: OkHttpClient\): GigaAmModelManager \{\n'
              r'        val ctx = mockk<Context>\(\)\n'
              r'        every \{ ctx\.filesDir \} returns filesDir\n'
              r'        every \{ ctx\.cacheDir \} returns filesDir\n'
              r'        return GigaAmModelManager\(ctx, http\)\n'
              r'    \}\n'
          )
          with_replacement = '''    private fun managerWith(filesDir: File, http: OkHttpClient): GigaAmModelManager =
              GigaAmModelManager(contextFor(filesDir), http)
          '''
          with_replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in with_replacement.splitlines()
          ) + '\n'
          s, n = with_pattern.subn(with_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'managerWith test helper replacement count={n}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify production scope and lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt \
            app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt \
            app/src/main/kotlin/com/bydmate/app/voice/GigaAmModelManager.kt \
            app/src/test/kotlin/com/bydmate/app/voice/GigaAmModelManagerTest.kt | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected scope:'; echo "$changed"; exit 1; }
          grep -q 'downloadToFileResume' app/src/main/kotlin/com/bydmate/app/voice/GigaAmModelManager.kt
          grep -Fq 'header("Range", "bytes=$existing-")' app/src/main/kotlin/com/bydmate/app/voice/GigaAmModelManager.kt
          grep -q 'ACTION_GIGAAM_DOWNLOAD' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -q 'START_STICKY' app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt
          grep -q 'observeGigaAmProvisioning' app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt
          test -z "$(git diff --name-only -- app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsScreen.kt)"
          ! grep -R 'BUILD57_' app/src/main/kotlin/com/bydmate/app/voice app/src/main/kotlin/com/bydmate/app/service

      - name: Compile and run focused GigaAM regression tests
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.bydmate.app.voice.GigaAmModelManagerTest' \
            --tests 'com.bydmate.app.voice.GigaAmSegmenterTest' \
            --tests 'com.bydmate.app.voice.GigaAmVadConfigTest' \
            --tests 'com.bydmate.app.cluster.SteeringWheelKeyDecisionTest' \
            --tests 'com.bydmate.app.service.A11yRecoveryGateTest'

      - name: Commit and push production source plus regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/kotlin/com/bydmate/app/voice/GigaAmModelManager.kt \
            app/src/main/kotlin/com/bydmate/app/ui/settings/SettingsViewModel.kt \
            app/src/main/kotlin/com/bydmate/app/service/TrackingService.kt \
            app/src/test/kotlin/com/bydmate/app/voice/GigaAmModelManagerTest.kt
          git diff --cached --check
          git commit -m "feat(dilink3): make GigaAM provisioning lifecycle-safe"
          git push origin HEAD:dilink3-production-v3143
