name: CI

on:
  push:
    branches: [main, "dilink3-friendly/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # PR-only: пуши в main всегда проходят полный локальный прогон перед релизом,
      # гонять 3.5k тестов второй раз на медленном раннере — дубль. На PR локального
      # прогона нет, там тесты обязательны.
      - name: Unit tests
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/dilink3-friendly/')
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile DiLink3 Friendly debug APK
        if: startsWith(github.ref, 'refs/heads/dilink3-friendly/')
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14
