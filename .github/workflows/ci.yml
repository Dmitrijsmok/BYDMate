name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Every main push gets its own run; only superseded PR checks are cancelled.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Release verification regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Dmitrijsmok/BYDMate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Never persist signing configuration/task state from the secret-bearing job.
          cache-disabled: true

      - name: Install pinned Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"'

      - name: Restore and verify permanent key, build and verify release APK
        env:
          BYDMATE_KEYSTORE_BASE64: ${{ secrets.ALICE_SIGNING_KEYSTORE_B64 }}
          BYDMATE_KEYSTORE_PASSWORD: ${{ secrets.ALICE_SIGNING_STORE_PASSWORD }}
          BYDMATE_KEY_PASSWORD: ${{ secrets.ALICE_SIGNING_KEY_PASSWORD }}
        run: python3 scripts/ci_release.py build

      - name: Upload verified signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: BYDMate-dilink3-release-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bydmate-verified-apk/BYDMate-dilink3-v*.apk
            ${{ runner.temp }}/bydmate-verified-apk/verification.json
          if-no-files-found: error
          retention-days: 30
